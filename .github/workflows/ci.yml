name: CI

# Orchestrator workflow — calls lint, build, and test in sequence.
# Runs on every push and every pull request to main.
# If lint fails → build is skipped → test is skipped (fail fast).
#
# Other repos can use the individual reusable workflows directly:
#   uses: DhunganaKB/Google_ADK_Youtube/.github/workflows/lint.yml@main
#   uses: DhunganaKB/Google_ADK_Youtube/.github/workflows/build.yml@main
#   uses: DhunganaKB/Google_ADK_Youtube/.github/workflows/test.yml@main
on:
  push:
    branches: [main]
    paths:
      # Only run CI when source code changes — not docs, terraform, frontend
      - 'youtube_analyst/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'
      - '.github/workflows/lint.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'youtube_analyst/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'
      - '.github/workflows/lint.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/test.yml'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  # ── Step 1: Lint ────────────────────────────────────────────────────────────
  # Runs ruff to catch style issues and formatting problems.
  # Fastest check — runs first so failures are caught immediately.
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml
    with:
      python-version: "3.13"
      working-directory: "."

  # ── Step 2: Build ───────────────────────────────────────────────────────────
  # Installs all dependencies and verifies the package is importable.
  # Only runs if lint passes.
  build:
    name: Build
    needs: lint
    uses: ./.github/workflows/build.yml
    with:
      python-version: "3.13"
      working-directory: "."

  # ── Step 3: Test ────────────────────────────────────────────────────────────
  # Runs unit tests with pytest (skips integration tests that need live GCP).
  # Only runs if build passes.
  test:
    name: Test
    needs: build
    uses: ./.github/workflows/test.yml
    with:
      python-version: "3.13"
      working-directory: "."
      test-path: "tests/unit"
