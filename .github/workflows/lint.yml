name: Lint (ruff)

# This is a REUSABLE workflow.
# It is not triggered directly — other workflows call it via `uses:`.
# Any repo can import it with:
#   uses: DhunganaKB/Google_ADK_Youtube/.github/workflows/lint.yml@main
on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        type: string
        default: "3.13"
      working-directory:
        description: "Directory containing pyproject.toml (useful for monorepos)"
        type: string
        default: "."

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      # ── 3. Install uv (fast package manager) ──────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # ── 4. Install dev dependencies (includes ruff) ────────────────────────
      # --no-install-project: installs deps only, not the package itself
      # This is faster and sufficient for linting
      - name: Install dependencies
        run: uv sync --frozen --dev --no-install-project

      # ── 5. Lint with ruff ──────────────────────────────────────────────────
      # ruff check: finds lint errors (unused imports, bad style, etc.)
      # ruff format --check: verifies code is formatted (does not auto-fix)
      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .
