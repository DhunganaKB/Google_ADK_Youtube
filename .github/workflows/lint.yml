name: Lint (ruff)

# This workflow delegates entirely to the shared reusable workflow in
# math-package-tutorial, which runs:
#   - lint    (ruff check)
#   - test    (pytest)
#   - pip-audit (dependency vulnerability scan)
#   - security (bandit + semgrep)
#
# Called by ci.yml via:
#   uses: ./.github/workflows/lint.yml
on:
  workflow_call:

jobs:
  lint-test-security:
    uses: DhunganaKB/math-package-tutorial/.github/workflows/lint_test.yaml@main
    with:
      source_path:      "youtube_analyst"
      requirements_path: "requirements.txt"
      tests_path:        "tests/unit"
      semgrep_rules:     "p/python p/owasp-top-ten"
